<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>코드 플래시카드</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #1a1a1a;
        color: #fff;
      }
      .stage-wrapper {
        display: flex;
        justify-content: center;
      }
      .stage {
        display: flex;
        align-items: center;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .chord-card {
        flex: 0 0 280px;
        text-align: center;
        padding: 1.5rem 1rem;
        visibility: hidden;
        min-height: 160px;
      }
      .chord-card .chord-name {
        font-size: 44px;
        font-weight: 500;
        color: #fff;
        line-height: 1;
      }
      .chord-card .chord-label {
        font-size: 13px;
        color: #666;
        margin-top: 8px;
      }
      #card-prev {
        opacity: 0.3;
      }
      #card-next {
        opacity: 0.45;
      }
      #card-current {
        border: 1px solid #333;
        border-radius: 16px;
        opacity: 1;
        visibility: visible;
      }
      #card-current .chord-name {
        font-size: 96px;
        color: #ef9f27;
      }
      #card-current .chord-label {
        font-size: 16px;
        color: #aaa;
        margin-top: 12px;
      }
      .timer-bar-bg {
        width: 200px;
        height: 5px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
        margin: 1.5rem auto 0;
      }
      .timer-bar {
        height: 100%;
        width: 100%;
        background: #ef9f27;
        border-radius: 2px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 1.5rem;
      }
      .btn-pill {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 18px;
        border-radius: 100px;
        border: 1px solid #3a3a3a;
        background: transparent;
        color: #888;
        font-size: 13px;
        font-family: sans-serif;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.15s, color 0.15s;
      }
      .btn-pill:hover {
        border-color: #666;
        color: #ccc;
      }
      .btn-pill-main {
        border: none;
        background: #ef9f27;
        color: #1a1a1a;
        font-weight: 600;
        padding: 9px 0;
        width: 100px;
        justify-content: center;
        transition: opacity 0.15s;
      }
      .btn-pill-main:hover { opacity: 0.88; }
      .count {
        font-size: 14px;
        color: #888;
        margin-top: 12px;
      }
      .speed-control {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .speed-bpm {
        font-size: 13px;
        color: #888;
      }
      .speed-bpm span {
        color: #ef9f27;
        font-weight: 500;
      }
      .speed-slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .speed-side {
        font-size: 11px;
        color: #444;
      }
      .bpm-presets {
        display: flex;
        gap: 6px;
      }
      .bpm-preset {
        padding: 3px 9px;
        border-radius: 100px;
        border: 1px solid #333;
        background: transparent;
        color: #555;
        font-size: 12px;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
      }
      .bpm-preset:hover { border-color: #666; color: #aaa; }
      .bpm-preset.active { border-color: #ef9f27; color: #ef9f27; }
      input[type="range"] {
        -webkit-appearance: none;
        width: 160px;
        height: 4px;
        background: #2e2e2e;
        border-radius: 2px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ef9f27;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="stage-wrapper">
      <div class="stage" id="stage">
        <div class="chord-card" id="card-prev">
          <div class="chord-name"></div>
          <div class="chord-label"></div>
        </div>
        <div class="chord-card" id="card-current">
          <div class="chord-name"></div>
          <div class="chord-label"></div>
          <div class="timer-bar-bg">
            <div class="timer-bar" id="timer-bar"></div>
          </div>
        </div>
        <div class="chord-card" id="card-next">
          <div class="chord-name"></div>
          <div class="chord-label"></div>
        </div>
      </div>
    </div>
    <div class="count" id="count-badge">시작 버튼을 눌러 시작하세요</div>
    <div class="speed-control">
      <div class="speed-bpm"><span id="bpm-value">6</span> BPM</div>
      <div class="speed-slider-row">
        <span class="speed-side">느리게</span>
        <input type="range" id="speed-slider" min="1" max="60" value="6">
        <span class="speed-side">빠르게</span>
      </div>
      <div class="bpm-presets">
        <button class="bpm-preset" onclick="setBpm(10)">10</button>
        <button class="bpm-preset" onclick="setBpm(20)">20</button>
        <button class="bpm-preset" onclick="setBpm(30)">30</button>
        <button class="bpm-preset" onclick="setBpm(40)">40</button>
        <button class="bpm-preset" onclick="setBpm(50)">50</button>
        <button class="bpm-preset" onclick="setBpm(60)">60</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn-pill" onclick="goBack()">
        <svg width="6" height="11" viewBox="0 0 6 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 1,5.5 5,10"/></svg>
        이전
      </button>
      <button class="btn-pill btn-pill-main" onclick="startStop()" id="start-btn">▶ 시작</button>
      <button class="btn-pill" onclick="nextChord()">
        다음
        <svg width="6" height="11" viewBox="0 0 6 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,1 5,5.5 1,10"/></svg>
      </button>
    </div>

    <script>
      const yellowChords = [
        ["Db",   "major"],
        ["DbM7", "major 7th"],
        ["Eb",   "major"],
        ["EbM7", "major 7th"],
        ["Ebm",  "minor"],
        ["Ebm7", "minor 7th"],
        ["Eb7",  "dominant 7th"],
        ["Gb",   "major"],
        ["GbM7", "major 7th"],
        ["F#m",  "minor"],
        ["F#m7", "minor 7th"],
        ["F#7",  "dominant 7th"],
        ["Ab",   "major"],
        ["AbM7", "major 7th"],
        ["G#m",  "minor"],
        ["G#m7", "minor 7th"],
        ["Ab7",  "dominant 7th"],
        ["Bb",   "major"],
        ["BbM7", "major 7th"],
        ["Bbm",  "minor"],
        ["Bbm7", "minor 7th"],
        ["Bb7",  "dominant 7th"],
        ["Cm",   "minor"],
        ["Cm7",  "minor 7th"],
        ["Fm",   "minor"],
        ["Fm7",  "minor 7th"],
        ["F7",   "dominant 7th"],
        ["C#m",  "minor"],
        ["C#m7", "minor 7th"],
        ["Db7",  "dominant 7th"],
      ];

      const CARD_W = 280;
      let INTERVAL = 10000;
      let running = false;
      let timer = null;
      let lastIdx = -1;
      let periodStart = 0;
      let elapsed = 0;
      let chordHistory = [];
      let historyIdx = -1;
      let sliding = false;

      function getRandomChord() {
        let i;
        do {
          i = Math.floor(Math.random() * yellowChords.length);
        } while (i === lastIdx && yellowChords.length > 1);
        lastIdx = i;
        return yellowChords[i];
      }

      function ensureNextPreview() {
        while (chordHistory.length <= historyIdx + 1) {
          chordHistory.push(getRandomChord());
        }
      }

      function setCard(id, chord) {
        const card = document.getElementById(id);
        card.querySelector(".chord-name").textContent = chord ? chord[0] : "";
        card.querySelector(".chord-label").textContent = chord ? chord[1] : "";
        if (id !== "card-current") {
          card.style.visibility = chord ? "visible" : "hidden";
        }
      }

      function updateDisplay() {
        setCard("card-prev",    historyIdx > 0 ? chordHistory[historyIdx - 1] : null);
        setCard("card-current", historyIdx >= 0 ? chordHistory[historyIdx] : null);
        setCard("card-next",    chordHistory[historyIdx + 1] || null);
        document.getElementById("count-badge").textContent =
          historyIdx >= 0 ? (historyIdx + 1) + "번째 코드" : "시작 버튼을 눌러 시작하세요";
      }

      function animateBar(fromPct, durationMs) {
        const b = document.getElementById("timer-bar");
        b.style.transition = "none";
        b.style.width = fromPct + "%";
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            b.style.transition = `width ${durationMs / 1000}s linear`;
            b.style.width = "0%";
          })
        );
      }

      function freezeBar() {
        const b = document.getElementById("timer-bar");
        const pct =
          (parseFloat(getComputedStyle(b).width) / b.parentElement.offsetWidth) * 100;
        b.style.transition = "none";
        b.style.width = pct + "%";
      }

      // direction: -1 = forward (slide left), +1 = back (slide right)
      function slide(direction, onMidpoint) {
        if (sliding) return;
        sliding = true;
        const stage = document.getElementById("stage");
        stage.style.transform = `translateX(${direction * CARD_W}px)`;
        setTimeout(() => {
          if (onMidpoint) onMidpoint();
          updateDisplay();
          stage.style.transition = "none";
          stage.style.transform = "translateX(0)";
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              stage.style.transition =
                "transform 0.35s cubic-bezier(0.4,0,0.2,1)";
              sliding = false;
            })
          );
        }, 350);
      }

      function scheduleAutoAdvance(remaining) {
        clearTimeout(timer);
        timer = setTimeout(function autoTick() {
          ensureNextPreview();
          slide(-1, () => {
            historyIdx++;
            ensureNextPreview();
            elapsed = 0;
            periodStart = Date.now();
            animateBar(100, INTERVAL);
            timer = setTimeout(autoTick, INTERVAL);
          });
        }, remaining);
      }

      function startStop() {
        const btn = document.getElementById("start-btn");
        if (!running) {
          running = true;
          btn.textContent = "⏸ 일시정지";
          if (historyIdx === -1) {
            chordHistory.push(getRandomChord());
            chordHistory.push(getRandomChord());
            historyIdx = 0;
            updateDisplay();
            elapsed = 0;
            periodStart = Date.now();
            animateBar(100, INTERVAL);
            scheduleAutoAdvance(INTERVAL);
          } else {
            const remaining = INTERVAL - elapsed;
            periodStart = Date.now();
            animateBar((remaining / INTERVAL) * 100, remaining);
            scheduleAutoAdvance(remaining);
          }
        } else {
          running = false;
          btn.textContent = "▶ 시작";
          clearTimeout(timer);
          elapsed += Date.now() - periodStart;
          freezeBar();
        }
      }

      function nextChord() {
        if (sliding) return;
        clearTimeout(timer);
        ensureNextPreview();
        slide(-1, () => {
          historyIdx++;
          ensureNextPreview();
          elapsed = 0;
          if (running) {
            periodStart = Date.now();
            animateBar(100, INTERVAL);
            scheduleAutoAdvance(INTERVAL);
          }
        });
      }

      function goBack() {
        if (sliding || historyIdx <= 0) return;
        clearTimeout(timer);
        slide(+1, () => {
          historyIdx--;
          elapsed = 0;
          if (running) {
            periodStart = Date.now();
            animateBar(100, INTERVAL);
            scheduleAutoAdvance(INTERVAL);
          }
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.code === "Space")      { e.preventDefault(); startStop(); }
        if (e.code === "Enter")      { e.preventDefault(); nextChord(); }
        if (e.code === "ArrowLeft")  { e.preventDefault(); goBack(); }
        if (e.code === "ArrowRight") { e.preventDefault(); nextChord(); }
      });

      function applySpeed(bpm) {
        const oldInterval = INTERVAL;
        INTERVAL = Math.round(60000 / bpm);
        document.getElementById("bpm-value").textContent = bpm;
        document.getElementById("speed-slider").value = bpm;
        document.querySelectorAll(".bpm-preset").forEach(b =>
          b.classList.toggle("active", parseInt(b.textContent) === bpm)
        );

        if (running) {
          const totalElapsed = elapsed + (Date.now() - periodStart);
          const fraction = Math.min(totalElapsed / oldInterval, 1);
          const newRemaining = INTERVAL * (1 - fraction);
          clearTimeout(timer);
          elapsed = Math.round(fraction * INTERVAL);
          periodStart = Date.now();
          animateBar((1 - fraction) * 100, newRemaining);
          scheduleAutoAdvance(newRemaining);
        } else if (historyIdx >= 0) {
          elapsed = Math.round((elapsed / oldInterval) * INTERVAL);
        }
      }

      function setBpm(bpm) {
        applySpeed(bpm);
      }

      ["input", "change"].forEach(evt =>
        document.getElementById("speed-slider").addEventListener(evt, function () {
          applySpeed(parseInt(this.value));
        })
      );
    </script>
  </body>
</html>
